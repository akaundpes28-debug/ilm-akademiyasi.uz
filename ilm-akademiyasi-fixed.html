<!doctype html>
<html lang="uz">
<head>

<title>Ilm Akademiyasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--bg:#EAF4FF;--coral:#FF6B6B;--mint:#2EC4B6;--sun:#FFC93C;--vio:#8B6CFF}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Onest,system-ui,sans-serif;background:var(--bg) repeating-linear-gradient(45deg,transparent 0 14px,rgba(20,33,61,.05) 14px 15px)}
#app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0)) 16px calc(30px + env(safe-area-inset-bottom,0))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
h1{margin:0;font:800 26px/1.1 Unbounded,system-ui,sans-serif}
h2{margin:6px 0 12px;font:800 22px Unbounded,system-ui,sans-serif}
.chip{flex:none;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:3px 3px 0 var(--ink)}
.sub{margin:0 0 16px;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card,.btn{border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);background:var(--c,#fff)}
button{font:600 16px Onest,system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)!important}
.tile{padding:16px 12px;text-align:left;min-height:130px;display:flex;flex-direction:column;gap:4px}
.tile i{font-style:normal;font-size:38px}
.tile b{font:800 16px Unbounded,system-ui,sans-serif}
.tile small{font-weight:400}
.btn{padding:14px;width:100%;margin-top:12px;background:var(--c,#fff)}
.back{border:0;background:none;box-shadow:none;padding:0 0 10px;font-weight:600}
.big{font:800 34px/1.2 Unbounded,system-ui,sans-serif;text-align:center;margin:10px 0;word-break:break-word}
.emo{font-size:84px;text-align:center;line-height:1.1}
.pad{padding:20px}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{padding:16px 8px;font-size:18px}
.opt.ok{--c:var(--mint)}.opt.bad{--c:var(--coral)}
.an{font-size:64px;padding:16px 0;text-align:center}
.w{display:inline-block;margin:2px 4px;font:800 24px Unbounded,system-ui,sans-serif;transition:transform .15s,color .15s}
.w.on{transform:scale(1.3) translateY(-4px);color:var(--coral)}
.stage{height:210px;position:relative;overflow:hidden;border-radius:14px;display:grid;place-items:center}
.cap{margin:10px 2px 0;font-size:14px}
/* animatsiyalar */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@keyframes dn{0%,100%{background:#8FD3FF}50%{background:#1B2A5C}}
.sys{background:#1B2A5C}
.sun{font-size:34px;position:absolute}
.r{position:absolute;left:50%;top:50%;border:2px dashed rgba(255,255,255,.5);border-radius:50%;animation:spin linear infinite}
.r s{position:absolute;top:-13px;left:50%;margin-left:-13px;font-size:24px;text-decoration:none;animation:spin linear infinite reverse;animation-duration:inherit}
.r1{width:90px;height:90px;margin:-45px;animation-duration:4s}
.r2{width:140px;height:140px;margin:-70px;animation-duration:8s}
.r3{width:190px;height:190px;margin:-95px;animation-duration:14s}
.pend{background:#FFF3D1}
.rod{position:absolute;top:0;left:50%;width:4px;height:150px;margin-left:-2px;background:var(--ink);transform-origin:top center;animation:swing 1.1s ease-in-out infinite alternate}
.rod b{position:absolute;bottom:-26px;left:-18px;width:40px;height:40px;border-radius:50%;background:var(--coral);border:3px solid var(--ink)}
.day{animation:dn 8s ease-in-out infinite}
.wheel{position:absolute;inset:0;animation:spin 8s linear infinite}
.wheel span{position:absolute;left:50%;margin-left:-20px;font-size:38px}
.wheel .s{top:14px}.wheel .m{bottom:14px}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:#3BA55D;border-top:3px solid var(--ink)}
.bar{height:10px;background:#E3E8F0;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
#toast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0));max-width:448px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
#mute{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0));width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);z-index:15;font-size:18px;padding:0}
@keyframes fl{50%{transform:translateY(-14px) rotate(6deg)}}
.fl{animation:fl 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
</style>
</head>
